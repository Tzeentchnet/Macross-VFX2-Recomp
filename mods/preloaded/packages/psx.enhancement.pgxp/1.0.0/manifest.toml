format_version = 5
id = "psx.enhancement.pgxp"
version = "1.0.0"
name = "PGXP Precision"
author = "psxrecomp"
description = "Sub-pixel vertex precision and perspective-correct texturing. Macross VF-X2 enables the validated per-vertex correction path by default while leaving guest-visible CPU propagation and precise culling opt-in."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPS-02237"

[[feature]]
id = "pgxp"
name = "PGXP Precision"
description = "Enabled by default. Corrects proven 3D vertex positions and texture perspective while leaving sprites, UI, and unproven vertices on the faithful path. Internal Resolution should be 2x or higher for the improvement to be visible."
group = "Visual"
default_enabled = true
quick = true

[[option]]
feature = "pgxp"
id = "cpu_mode"
label = "CPU-mode propagation"
description = "Also track precision through CPU arithmetic. Leave this off unless title-specific traces prove that projected vertices are repacked through integer math."
group = "Visual"
type = "boolean"
default = "false"

[[option]]
feature = "pgxp"
id = "culling"
label = "Precise culling"
description = "Use full-precision positions for face-culling decisions. This changes guest-visible geometry and remains off until Macross VF-X2 is validated with it."
group = "Visual"
type = "boolean"
default = "false"

[[option]]
feature = "pgxp"
id = "geometry"
label = "Geometry correction"
description = "Use subpixel vertex positions to reduce polygon wobble."
group = "Visual"
type = "boolean"
default = "true"

[[option]]
feature = "pgxp"
id = "perspective"
label = "Perspective textures"
description = "Correct texture perspective to reduce warping."
group = "Visual"
type = "boolean"
default = "true"

[[plugin]]
feature = "pgxp"
id = "psx.pgxp"
